services:
  - type: web
    name: forgeai
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: "cd forge-ai && npm install && npm run build"
    startCommand: "node forge-ai/backend/dist/index.js"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
