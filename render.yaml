services:
  - type: web
    name: forgeai
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: "cd forge-ai && npm install && npm run build && npm install --prefix site-template --legacy-peer-deps --no-audit --no-fund --no-package-lock"
    startCommand: "node --max-old-space-size=120 forge-ai/backend/dist/index.js"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: /api
